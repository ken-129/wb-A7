<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register – ZipMart</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="wrap header-row">
    <a class="logo" href="index.html">zip<span>mart</span></a>
  </div>
</header>

<main class="auth-box">
  <h1>Create account</h1>
  <form>
    <input type="text" id="name" placeholder="Full name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password (at least 6 characters)" minlength="6" required>
    <input type="password" id="confirm" placeholder="Confirm password" required>
    <button class="order-btn" type="button">Register</button>
  </form>
  <p class="auth-note">Already have an account? <a href="login.html">Sign in</a></p>
</main>


</body>
</html>
