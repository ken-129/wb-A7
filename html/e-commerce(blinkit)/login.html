<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – ZipMart</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="wrap header-row">
    <a class="logo" href="index.html">zip<span>mart</span></a>
  </div>
</header>

<main class="auth-box">
  <h1>Sign in</h1>
  <form>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button class="order-btn" type="button">Sign in</button>
  </form>
  <p class="auth-note">New here? <a href="register.html">Create an account</a></p>
</main>


</body>
</html>
